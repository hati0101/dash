<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0e10">
<title>REAL 작업실</title>
<link rel="icon" href="favicon.ico?v=s7" sizes="any">
<link rel="icon" href="favicon-64.png?v=s7" type="image/png" sizes="64x64">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=s7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REAL">
<link rel="stylesheet" href="sched.css?v=s10">
<script src="sched.js?v=s10" defer></script>
</head>
<body>
<main id="lock" class="lock" aria-labelledby="lock-title">
  <form id="lock-form" class="lock-card" autocomplete="off">
    <img class="mark-img lg" src="brand-mark.png?v=s7" alt="" width="56" height="56">
    <h1 id="lock-title">REAL 작업실</h1>
    <p class="lock-sub">일정 · 작업 관리 · 비공개</p>
    <label class="sr" for="pw">비밀번호</label>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required minlength="1" autofocus>
    <label class="check"><input id="remember" type="checkbox"> 이 기기에서 기억 <span class="muted">(공용 PC에서는 끄기)</span></label>
    <button id="unlock" type="submit">열기</button>
    <p id="lock-msg" class="lock-msg" role="status" aria-live="polite"></p>
    <p class="lock-foot">데이터는 암호화된 상태로 게시되며 이 브라우저 안에서만 풀립니다.<br><span id="lock-published"></span></p>
  </form>
</main>
<div id="app" class="app" hidden></div>
<noscript><p class="noscript">이 페이지는 JavaScript가 필요합니다.</p></noscript>
</body>
</html>
